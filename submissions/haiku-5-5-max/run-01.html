<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Black hole: gravitational lensing</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#e8ecf8;font:13px/1.5 "Avenir Next","Gill Sans","Segoe UI",system-ui,sans-serif}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #c:active{cursor:grabbing}
  #ui{position:fixed;left:16px;top:calc(16px + env(safe-area-inset-top,0px));width:248px;max-width:calc(100vw - 32px);padding:16px 18px;border-radius:14px;background:rgba(5,7,14,.6);border:1px solid rgba(255,220,180,.12);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);user-select:none}
  h1{margin:0 0 4px;font-size:16px;font-weight:300;letter-spacing:.04em}
  #ui p{margin:0 0 14px;color:#9aa3bd;font-size:12px}
  label{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;color:#c9cfe2;font-size:12px}
  input[type=range]{width:100%;accent-color:#ffb766}
  .row{display:flex;gap:8px;margin-top:4px}
  button{flex:1;padding:8px;border-radius:9px;border:1px solid rgba(255,220,180,.2);background:rgba(255,255,255,.05);color:#f1f3fb;font:inherit;cursor:pointer}
  button:hover{background:rgba(255,255,255,.12)}
  button:focus-visible,input:focus-visible{outline:2px solid #ffb766;outline-offset:2px}
  #stat{margin-top:12px;color:#77809c;font-size:11px;font-variant-numeric:tabular-nums}
  #msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;white-space:pre-line;background:#000;color:#f2b8a6;font-size:15px}
</style>
</head>
<body>
<canvas id="c" aria-label="Black hole with gravitational lensing and an accretion disc"></canvas>
<div id="ui">
  <h1>Black hole</h1>
  <p>Light is traced through curved spacetime (r<sub>s</sub> = 1). Drag to orbit, scroll to zoom.</p>
  <label>Disc brightness <input id="disc" type="range" min="0.2" max="3" step="0.05" value="1"></label>
  <label>Orbit speed <input id="orbit" type="range" min="0" max="0.4" step="0.01" value="0.07"></label>
  <div class="row"><button id="pause" type="button">Pause</button><button id="reset" type="button">Reset view</button></div>
  <div id="stat"></div>
</div>
<div id="msg"></div>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('c');
  const discEl = document.getElementById('disc');
  const orbitEl = document.getElementById('orbit');
  const pauseBtn = document.getElementById('pause');
  const resetBtn = document.getElementById('reset');
  const statEl = document.getElementById('stat');
  const msgEl = document.getElementById('msg');

  const VS = 'attribute vec2 aPos; void main() { gl_Position = vec4(aPos, 0.0, 1.0); }';
  const FS = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 uRes;
uniform vec3 uPos, uFwd, uRight, uUp;
uniform float uTanHalf, uTime, uDisc;

const float RIN = 3.0;    // innermost stable circular orbit (6M) with r_s = 1
const float ROUT = 13.0;  // outer edge of the disc
const float ESC = 40.0;   // rays beyond this radius have escaped

float hash(vec3 p) { return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }

vec3 blackbody(float T) {
  float t = clamp(T, 1100.0, 40000.0) / 100.0;
  float r = t <= 66.0 ? 1.0 : clamp(1.29294 * pow(t - 60.0, -0.1332), 0.0, 1.0);
  float g = t <= 66.0 ? clamp(0.39008 * log(t) - 0.63184, 0.0, 1.0)
                      : clamp(1.12989 * pow(t - 60.0, -0.07551), 0.0, 1.0);
  float b = t >= 66.0 ? 1.0 : clamp(0.54321 * log(t - 10.0) - 1.19625, 0.0, 1.0);
  return vec3(r, g, b);
}

vec3 stars(vec3 d, float s, float thr) {
  vec3 g = d * s;
  vec3 c = floor(g);
  float h = hash(c);
  if (h < thr) return vec3(0.0);
  vec3 jit = vec3(hash(c + 11.0), hash(c + 23.0), hash(c + 37.0)) - 0.5;
  float dd = length(fract(g) - 0.5 - jit * 0.6);
  float k = (h - thr) / (1.0 - thr);
  float I = k * k * (1.0 - smoothstep(0.0, 0.22, dd)) * 2.5;
  return mix(vec3(1.0, 0.8, 0.6), vec3(0.75, 0.85, 1.0), hash(c + 5.0)) * I;
}

vec3 sky(vec3 d) {
  float band = exp(-d.y * d.y * 16.0);
  float dust = 0.55 + 0.45 * sin(d.x * 7.0 + 1.7 * sin(d.z * 5.0)) * sin(d.z * 9.0 - d.y * 4.0);
  return vec3(0.12, 0.10, 0.14) * band * dust + stars(d, 140.0, 0.986) + stars(d, 380.0, 0.996);
}

vec3 disc(vec3 c, vec3 v, float rc) {
  float Om = sqrt(0.5 / (rc * rc * rc));          // Keplerian angular velocity (M = 0.5)
  float ut = 1.0 / sqrt(1.0 - 1.5 / rc);          // time dilation of the orbiting gas
  float lam = c.x * v.z - c.z * v.x;              // photon L_y / E, sign fixed for backward tracing
  float g = clamp(1.0 / (ut * max(1.0 - Om * lam, 0.1)), 0.25, 3.0); // gravitational + Doppler shift
  float ph = atan(c.z, c.x) + 4.0 * Om * uTime;   // surface texture co-moves with the gas
  float turb = 0.6 + 0.4 * sin(7.0 * ph + 2.5 * log(rc)) * sin(19.0 * ph - 5.0 * rc);
  float Tob = g * 9000.0 * pow(RIN / rc, 0.75);   // observed colour temperature
  float edge = smoothstep(RIN, RIN * 1.12, rc) * (1.0 - smoothstep(ROUT * 0.8, ROUT, rc));
  return blackbody(Tob) * (0.5 * uDisc * pow(Tob / 5000.0, 2.5) * edge * turb);
}

vec3 trace(vec3 p, vec3 v) {
  vec3 Lv = cross(p, v);
  float H2 = dot(Lv, Lv);                  // conserved squared angular momentum
  vec3 col = vec3(0.0);
  float tr = 1.0;                          // remaining transmittance
  int hits = 0;
  bool escaped = false;
  for (int i = 0; i < 300; i++) {
    float r2 = dot(p, p);
    float r = sqrt(r2);
    if (r < 1.02) break;                   // captured by the horizon
    if (r > ESC && dot(p, v) > 0.0) { escaped = true; break; }
    vec3 q = p;
    float dt = clamp(0.04 * r, 0.015, 0.5);
    v -= 1.5 * H2 * p / (r2 * r2 * r) * dt; // null geodesic: a = -1.5 h^2 x / r^5
    p += v * dt;
    if (hits < 3 && q.y * p.y < 0.0) {     // crossed the disc plane y = 0
      vec3 c = mix(q, p, q.y / (q.y - p.y));
      float rc = length(c.xz);
      if (rc > RIN && rc < ROUT) {
        col += tr * disc(c, v, rc);
        tr *= 0.45;
        hits++;
      }
    }
  }
  if (escaped) col += tr * sky(normalize(v));
  return col;
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  vec3 rd = normalize(uFwd + (uv.x * uRight + uv.y * uUp) * (2.0 * uTanHalf));
  gl_FragColor = vec4(1.0 - exp(-trace(uPos, rd)), 1.0);
}
`;

  const cam = { yaw: 0, pitch: 0.12, dist: 26 };
  const U = {};
  let gl = null, prog = null, q = 1, simT = 0, paused = false, dirty = true, drag = null;
  let last = performance.now(), statT = last, frames = 0, ema = 16.7, lastAdapt = 0;

  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }

  function init() {
    gl = canvas.getContext('webgl', { antialias: false, alpha: false });
    if (!gl) throw new Error('This browser does not support WebGL.');
    prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'aPos');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    for (const n of ['uRes', 'uPos', 'uFwd', 'uRight', 'uUp', 'uTanHalf', 'uTime', 'uDisc']) {
      U[n] = gl.getUniformLocation(prog, n);
    }
    dirty = true;
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(2, Math.round(innerWidth * dpr * q));
    const h = Math.max(2, Math.round(innerHeight * dpr * q));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; dirty = true; }
    if (gl) gl.viewport(0, 0, w, h);
  }

  // Trade resolution for frame rate, gently, so the simulation stays smooth on any GPU.
  function adapt() {
    if (ema > 30 && q > 0.25) { q = Math.max(0.25, q * 0.82); resize(); }
    else if (ema < 17 && q < 1) { q = Math.min(1, q * 1.05); resize(); }
  }

  function draw() {
    const cp = Math.cos(cam.pitch);
    const P = [cam.dist * cp * Math.sin(cam.yaw), cam.dist * Math.sin(cam.pitch), cam.dist * cp * Math.cos(cam.yaw)];
    const F = norm([-P[0], -P[1], -P[2]]);
    const R = norm(cross(F, [0, 1, 0]));
    const Up = cross(R, F);
    gl.uniform2f(U.uRes, canvas.width, canvas.height);
    gl.uniform3f(U.uPos, P[0], P[1], P[2]);
    gl.uniform3f(U.uFwd, F[0], F[1], F[2]);
    gl.uniform3f(U.uRight, R[0], R[1], R[2]);
    gl.uniform3f(U.uUp, Up[0], Up[1], Up[2]);
    gl.uniform1f(U.uTanHalf, 0.364);          // roughly 40 degree vertical field of view
    gl.uniform1f(U.uTime, simT);
    gl.uniform1f(U.uDisc, Number(discEl.value));
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    ema = ema * 0.9 + dt * 100;               // smoothed frame time in ms
    if (!paused) {
      simT += dt;
      cam.yaw += dt * Number(orbitEl.value);
      dirty = true;
    }
    if (now - lastAdapt > 600) { lastAdapt = now; adapt(); }
    if (dirty && gl) { draw(); dirty = false; }
    frames++;
    if (now - statT > 500) {
      statEl.textContent = Math.round(frames * 1000 / (now - statT)) + ' fps, ' + Math.round(q * 100) + '% resolution';
      frames = 0;
      statT = now;
    }
    requestAnimationFrame(loop);
  }

  canvas.addEventListener('pointerdown', e => {
    drag = [e.clientX, e.clientY];
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    if (!drag) return;
    cam.yaw -= (e.clientX - drag[0]) * 0.005;
    cam.pitch = clamp(cam.pitch + (e.clientY - drag[1]) * 0.005, -1.45, 1.45);
    drag = [e.clientX, e.clientY];
    dirty = true;
  });
  const endDrag = () => { drag = null; };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 6, 60);
    dirty = true;
  }, { passive: false });
  discEl.addEventListener('input', () => { dirty = true; });
  pauseBtn.addEventListener('click', () => {
    paused = !paused;
    pauseBtn.textContent = paused ? 'Play' : 'Pause';
    dirty = true;
  });
  resetBtn.addEventListener('click', () => {
    Object.assign(cam, { yaw: 0, pitch: 0.12, dist: 26 });
    dirty = true;
  });

  try {
    init();
  } catch (err) {
    console.error(err);
    msgEl.textContent = 'The black hole could not start.\n' + err.message;
    msgEl.style.display = 'flex';
    return;
  }

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  q = clamp(Math.sqrt(1.0e6 / (innerWidth * innerHeight * dpr * dpr)), 0.25, 1);
  resize();
  window.addEventListener('resize', resize);
  canvas.addEventListener('webglcontextlost', e => e.preventDefault());
  canvas.addEventListener('webglcontextrestored', () => { init(); resize(); });

  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) {
    paused = true;
    pauseBtn.textContent = 'Play';
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
