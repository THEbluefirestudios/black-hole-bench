<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Gargantua — Interstellar Black Hole</title>
<style>
:root{--accent:#ffb454;--panel:rgba(9,11,15,.74)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#cfd6e4;
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#view:active{cursor:grabbing}
#hud{position:fixed;top:16px;left:16px;width:258px;padding:14px 16px 15px;background:var(--panel);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,180,84,.18);border-radius:10px;user-select:none;z-index:5}
h1{font-size:15px;letter-spacing:7px;font-weight:600;color:#fff}
.sub{font-size:9px;letter-spacing:.9px;color:#8b93a7;margin:5px 0 13px;text-transform:uppercase;line-height:1.5}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0;font-size:11px;letter-spacing:.5px}
.row label{color:#9aa3b5}
.row .val{color:var(--accent);font-variant-numeric:tabular-nums;min-width:38px;text-align:right;font-family:Consolas,monospace;font-size:10px}
input[type=range]{-webkit-appearance:none;appearance:none;width:108px;height:3px;background:rgba(255,255,255,.14);border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--accent);cursor:pointer;border:none}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border:none;border-radius:50%;background:var(--accent);cursor:pointer}
select{background:#141821;color:#cfd6e4;border:1px solid rgba(255,255,255,.12);border-radius:5px;font-size:11px;padding:3px 6px;outline:none;font-family:inherit}
button{background:rgba(255,180,84,.12);color:var(--accent);border:1px solid rgba(255,180,84,.3);
  border-radius:6px;font-size:10px;letter-spacing:1.2px;padding:6px 8px;cursor:pointer;flex:1;font-family:inherit}
button:hover{background:rgba(255,180,84,.24)}
.btns{display:flex;gap:8px;margin:12px 0 2px}
.chk{display:flex;align-items:center;gap:6px;font-size:11px;color:#9aa3b5;cursor:pointer}
.chk input{accent-color:var(--accent)}
hr{border:none;border-top:1px solid rgba(255,255,255,.08);margin:11px 0}
#stats{position:fixed;bottom:13px;left:16px;font-size:10px;letter-spacing:1px;color:#5d6577;
  font-family:Consolas,monospace;z-index:5}
#hint{position:fixed;bottom:13px;right:16px;font-size:10px;letter-spacing:1.6px;color:#5d6577;
  text-transform:uppercase;z-index:5}
#nogl{display:none;position:fixed;inset:0;align-items:center;justify-content:center;background:#05060a;
  color:#ffb454;font-size:14px;letter-spacing:2px;text-align:center;padding:40px;line-height:2;z-index:9}
@media (max-width:640px){#hud{width:calc(100% - 32px)}#hint{display:none}}
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="hud">
  <h1>GARGANTUA</h1>
  <div class="sub">geodesic ray tracing &middot; schwarzschild</div>

  <div class="row"><label>Exposure</label>
    <input type="range" id="exposure" min="0.15" max="3" step="0.01" value="1"><span class="val" id="exposureV">1.00</span></div>
  <div class="row"><label>Disc luminosity</label>
    <input type="range" id="discbright" min="0.2" max="3" step="0.01" value="1"><span class="val" id="discbrightV">1.00</span></div>
  <div class="row"><label>Bloom</label>
    <input type="range" id="bloom" min="0" max="1.5" step="0.01" value="0.45"><span class="val" id="bloomV">0.45</span></div>
  <div class="row"><label>Time scale</label>
    <input type="range" id="speed" min="0" max="3" step="0.01" value="1"><span class="val" id="speedV">1.00</span></div>
  <div class="row"><label>Field of view</label>
    <input type="range" id="fov" min="28" max="75" step="1" value="50"><span class="val" id="fovV">50&deg;</span></div>

  <hr>
  <div class="row"><label>Quality</label>
    <select id="quality">
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high" selected>High</option>
      <option value="ultra">Ultra</option>
    </select></div>
  <div class="row" style="justify-content:flex-start">
    <label class="chk"><input type="checkbox" id="auto" checked> Adaptive resolution</label></div>

  <div class="btns">
    <button id="pause">PAUSE</button>
    <button id="reset">RESET VIEW</button>
  </div>
</div>

<div id="stats">&nbsp;</div>
<div id="hint">Drag to orbit &middot; Scroll to zoom &middot; Space = pause</div>
<div id="nogl">WEBGL2 UNAVAILABLE<br><span style="font-size:11px;color:#8b93a7">This simulation requires a WebGL2-capable browser.</span></div>

<script>
(function(){
'use strict';

window.addEventListener('error', function(e){
  const n=document.getElementById('nogl');
  n.style.display='flex';
  n.innerHTML='RUNTIME ERROR<br><span style="font-size:11px;color:#8b93a7">'+
    String(e.message||e).replace(/</g,'&lt;')+'</span>';
});

const canvas = document.getElementById('view');
const gl = canvas.getContext('webgl2', {
  antialias:false, alpha:false, depth:false, stencil:false,
  powerPreference:'high-performance', preserveDrawingBuffer:false
});
if(!gl){ document.getElementById('nogl').style.display='flex'; return; }
gl.getExtension('EXT_color_buffer_float');
gl.getExtension('EXT_color_buffer_half_float');

/* ---------------------------------------------------------------- shaders */

const VERT = `#version 300 es
layout(location=0) in vec2 aPos;
out vec2 vUv;
void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0.0,1.0); }`;

const SCENE_FRAG = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 outColor;

uniform vec2  uRes;
uniform float uTime;
uniform vec3  uCamPos;
uniform vec3  uCamFwd;
uniform vec3  uCamRight;
uniform vec3  uCamUp;
uniform float uTanFov;
uniform int   uSteps;
uniform float uExposure;
uniform int   uHDR;
uniform float uDiscBright;

const float M        = 0.5;      /* mass (Rs = 2M = 1) */
const float RS       = 1.0;      /* Schwarzschild radius */
const float DISC_IN  = 2.9;      /* ~ISCO = 6M */
const float DISC_OUT = 13.5;
const float FAR      = 60.0;

float hash21(vec2 p){
  p = fract(p*vec2(127.1,311.7));
  p += dot(p,p+34.56);
  return fract(p.x*p.y);
}
float hash13(vec3 p3){
  p3 = fract(p3*0.1031);
  p3 += dot(p3,p3.zyx+31.32);
  return fract((p3.x+p3.y)*p3.z);
}
vec3 hash33(vec3 p3){
  p3 = fract(p3*vec3(0.1031,0.1030,0.0973));
  p3 += dot(p3,p3.yxz+33.33);
  return fract((p3.xxy+p3.yxx)*p3.zyx);
}

float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f*f*(3.0-2.0*f);
  float a=hash21(i), b=hash21(i+vec2(1,0)), c=hash21(i+vec2(0,1)), d=hash21(i+vec2(1,1));
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
}
float fbm(vec2 p){
  float s=0.0, a=0.5;
  mat2 rot = mat2(0.8,0.6,-0.6,0.8);
  for(int i=0;i<5;i++){ s += a*vnoise(p); p = rot*p*2.03 + vec2(17.3,9.1); a *= 0.5; }
  return s;
}
float vnoiseW(vec2 p, float period){
  vec2 i = floor(p), f = fract(p);
  f = f*f*(3.0-2.0*f);
  float x0 = mod(i.x,period), x1 = mod(i.x+1.0,period);
  float a=hash21(vec2(x0,i.y)), b=hash21(vec2(x1,i.y));
  float c=hash21(vec2(x0,i.y+1.0)), d=hash21(vec2(x1,i.y+1.0));
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
}
float fbmW(vec2 p, float period){
  float s=0.0, a=0.5;
  for(int i=0;i<5;i++){
    s += a*vnoiseW(p,period);
    p = p*2.0 + vec2(11.7,5.3); period *= 2.0; a *= 0.5;
  }
  return s;
}

/* Tanner Helland blackbody approximation, returns linear-ish RGB in 0..1 */
vec3 blackbody(float t){
  t = clamp(t,800.0,40000.0)*0.001;
  float r,g,b;
  if(t<=66.0) r = 1.0;
  else r = clamp(1.292936186*pow(t-60.0,-0.1332047592),0.0,1.0);
  if(t<=66.0) g = clamp(0.3900815788*log(max(t,1.0))-0.6318414437,0.0,1.0);
  else g = clamp(1.129890861*pow(t-60.0,-0.0755148492),0.0,1.0);
  if(t>=66.0) b = 1.0;
  else if(t<=19.0) b = 0.0;
  else b = clamp(0.5432067891*log(t-10.0)-1.19625408,0.0,1.0);
  return vec3(r,g,b);
}

vec3 starLayer(vec3 rd, float scale, float bright){
  vec3 p = rd*scale;
  vec3 id = floor(p);
  vec3 f = fract(p);
  vec3 h = hash33(id);
  float d = length(f-h);
  float mag = hash13(id+7.7);
  float b = pow(mag,10.0);
  float size = mix(0.015,0.06,pow(mag,3.0));
  float s = smoothstep(size,size*0.15,d);
  s += 0.35*exp(-d*d/(size*size*10.0))*pow(mag,16.0);
  vec3 tint = mix(vec3(0.72,0.83,1.0), vec3(1.0,0.84,0.66), hash13(id+3.3));
  tint = mix(tint, vec3(1.0), 0.35);
  return tint*s*b*bright;
}

vec3 background(vec3 rd){
  vec3 col = vec3(0.0);
  col += starLayer(rd,16.0,6.0);
  col += starLayer(rd,38.0,1.3);
  float u = atan(rd.z,rd.x)*0.1591549+0.5;
  float v = asin(clamp(rd.y,-1.0,1.0))*0.3183099+0.5;
  vec3 bandN = normalize(vec3(0.42,0.78,0.46));
  float bd = dot(rd,bandN);
  float band = exp(-7.0*bd*bd);
  float n  = fbmW(vec2(u*24.0,v*12.0),24.0);
  float n2 = fbmW(vec2(u*60.0+3.1,v*30.0),60.0);
  col += vec3(0.24,0.31,0.55)*pow(n,2.2)*band*0.05;
  col += vec3(0.55,0.33,0.22)*pow(n2,3.0)*band*0.022;
  return col;
}

/* accretion disc emission + opacity at a plane crossing */
vec4 shadeDisc(vec3 hp, vec3 rdir){
  float r = length(hp.xz);
  float t01 = clamp((r-DISC_IN)/(DISC_OUT-DISC_IN),0.0,1.0);

  float profile = pow(DISC_IN/r,1.8);
  float edgeIn  = smoothstep(0.0,0.045,t01);
  float edgeOut = 1.0-smoothstep(0.45,0.95,t01);

  /* keplerian differential rotation, seam-free polar noise */
  float ang   = atan(hp.z,hp.x);
  float omega = sqrt(M/(r*r*r));
  float phase = ang - uTime*omega*4.0;
  vec2 np = vec2(cos(phase)*1.15 + log(r)*9.0, sin(phase)*1.15);
  float n     = fbm(np*1.6);
  float fine  = vnoise(np*14.0);
  float density = mix(0.40,1.20,n)*mix(0.82,1.18,fine);

  float T = 13000.0*pow(DISC_IN/r,0.5);

  /* keplerian velocity, doppler + gravitational redshift */
  float beta = clamp(sqrt(M/r)/sqrt(max(1.0-RS/r,0.10)),0.0,0.90);
  float gam  = inversesqrt(max(1.0-beta*beta,0.01));
  vec3 orbitDir = normalize(vec3(hp.z,0.0,-hp.x));
  float dop  = 1.0/(gam*(1.0+beta*dot(orbitDir,rdir)));
  float grav = sqrt(max(1.0-RS/r,0.02));
  float g    = clamp(dop*grav,0.12,4.0);

  vec3  tint  = blackbody(T*g);
  float boost = pow(g,3.5);
  vec3  em    = tint*boost*profile*density*edgeIn*edgeOut*uDiscBright;

  float thick = 0.055*r;
  float path  = thick/max(abs(rdir.y),0.045);
  float od    = path*density*(0.30+0.70*profile)*1.5;
  float alpha = 1.0-exp(-od);
  return vec4(em,alpha);
}

void main(){
  vec2 fc = gl_FragCoord.xy;
  vec2 ndc = (fc/uRes)*2.0-1.0;
  float aspect = uRes.x/uRes.y;
  ndc.x *= aspect;
  vec2 jit = (vec2(hash21(fc),hash21(fc+37.71))-0.5)/uRes.y;
  vec3 rd = normalize(uCamFwd + (ndc.x+jit.x)*uTanFov*uCamRight
                            + (ndc.y+jit.y)*uTanFov*uCamUp);

  vec3 pos = uCamPos;
  vec3 vel = rd;
  vec3 col = vec3(0.0);
  float trans = 1.0;
  bool escaped = false;
  vec3 escDir = rd;

  /* null geodesics in schwarzschild spacetime (M = 0.5):
     d2r/dl2 = -3M h^2 r / r^5 , h = |r x v| conserved  */
  for(int i=0;i<900;i++){
    if(i>=uSteps) break;
    float r2 = dot(pos,pos);
    float r  = sqrt(r2);
    if(r < RS*1.02) break;                       /* event horizon -> shadow */
    if(r > FAR && dot(pos,vel) > 0.0){ escaped = true; escDir = vel; break; }

    float dt = clamp(0.045*r,0.012,0.85);

    vec3  hv   = cross(pos,vel);
    float h2   = dot(hv,hv);
    float ir   = inversesqrt(r2);
    float ir5  = ir*ir*ir*ir*ir;
    vel += -1.5*h2*pos*ir5*dt;
    vec3 npos  = pos + vel*dt;

    if(pos.y*npos.y < 0.0 && trans > 0.012){
      float tt = pos.y/(pos.y-npos.y);
      vec3  hp = mix(pos,npos,tt);
      float hr = length(hp.xz);
      if(hr > DISC_IN && hr < DISC_OUT){
        vec3 rdir = vel*inversesqrt(max(dot(vel,vel),1e-6));
        vec4 ds = shadeDisc(hp,rdir);
        col += trans*ds.rgb;
        trans *= 1.0-ds.a;
        if(trans < 0.012) break;
      }
    }
    pos = npos;
  }

  if(escaped && trans > 0.0)
    col += trans*background(normalize(escDir));

  if(uHDR==0){                                    /* LDR fallback path */
    col *= uExposure;
    col = (col*(2.51*col+0.03))/(col*(2.43*col+0.59)+0.14);
    col = clamp(col,0.0,1.0);
  }
  outColor = vec4(col,1.0);
}`;

const POST_FRAG = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 o;
uniform sampler2D uTex;
uniform vec2 uTexel;
uniform float uThreshold;
uniform int uMode;            /* 0 bright-pass, 1 blur H, 2 blur V */
void main(){
  if(uMode==0){
    vec3 c = texture(uTex,vUv).rgb;
    float br = max(c.r,max(c.g,c.b));
    float knee = uThreshold*0.6;
    float rq = clamp(br-uThreshold+knee,0.0,2.0*knee);
    rq = rq*rq/(4.0*knee+1e-5);
    float w = max(rq,br-uThreshold)/max(br,1e-5);
    o = vec4(c*clamp(w,0.0,1.0),1.0);
  }else{
    vec2 dir = (uMode==1)?vec2(uTexel.x,0.0):vec2(0.0,uTexel.y);
    vec3 s = texture(uTex,vUv).rgb*0.227027;
    s += (texture(uTex,vUv+dir*1.3846).rgb+texture(uTex,vUv-dir*1.3846).rgb)*0.3162162;
    s += (texture(uTex,vUv+dir*3.2307).rgb+texture(uTex,vUv-dir*3.2307).rgb)*0.0702702;
    o = vec4(s,1.0);
  }
}`;

const COMP_FRAG = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 o;
uniform sampler2D uScene;
uniform sampler2D uBloom;
uniform float uExposure;
uniform float uBloomAmt;
uniform int uHDR;
uniform float uTime;
float hash21(vec2 p){ p=fract(p*vec2(127.1,311.7)); p+=dot(p,p+34.56); return fract(p.x*p.y); }
void main(){
  vec2 d = vUv-0.5;
  float ca = 0.014*dot(d,d);
  vec3 col;
  col.r = texture(uScene, vUv+d*ca).r;
  col.g = texture(uScene, vUv).g;
  col.b = texture(uScene, vUv-d*ca).b;
  col += texture(uBloom,vUv).rgb*uBloomAmt;
  if(uHDR==1){
    col *= uExposure;
    col = (col*(2.51*col+0.03))/(col*(2.43*col+0.59)+0.14);
  }
  col *= 1.0-0.34*pow(length(d)*1.42,2.6);
  col = clamp(col,0.0,1.0);
  col = pow(col,vec3(1.0/2.2));
  col += (hash21(vUv*vec2(1913.0,1071.0)+fract(uTime)*71.13)-0.5)*0.013;
  o = vec4(col,1.0);
}`;

/* ---------------------------------------------------------------- gl utils */

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    console.error(gl.getShaderInfoLog(s), src);
    throw new Error('shader compile failed');
  }
  return s;
}
function program(vs, fs){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)){
    console.error(gl.getProgramInfoLog(p));
    throw new Error('program link failed');
  }
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){
    const info = gl.getActiveUniform(p,i);
    u[info.name] = gl.getUniformLocation(p, info.name);
  }
  return {p,u};
}

let progScene, progPost, progComp;
try{
  progScene = program(VERT, SCENE_FRAG);
  progPost  = program(VERT, POST_FRAG);
  progComp  = program(VERT, COMP_FRAG);
}catch(e){
  document.getElementById('nogl').style.display='flex';
  document.getElementById('nogl').innerHTML = 'SHADER ERROR<br><span style="font-size:11px;color:#8b93a7">See console for details.</span>';
  return;
}

const quad = gl.createVertexArray();
gl.bindVertexArray(quad);
const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
gl.bindVertexArray(null);

/* float render targets if supported, else 8-bit fallback */
let HDR = 1, TEX_IFMT = gl.RGBA16F;
{
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texStorage2D(gl.TEXTURE_2D,1,gl.RGBA16F,4,4);
  const f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
  if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE){
    HDR = 0; TEX_IFMT = gl.RGBA8;
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.deleteFramebuffer(f); gl.deleteTexture(t);
}

function makeTex(w,h){
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texStorage2D(gl.TEXTURE_2D,1,TEX_IFMT,w,h);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  return t;
}
function makeFBO(tex){
  const f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  return f;
}

let sceneTex=null, sceneFBO=null, bloomA=null, bloomB=null, fboA=null, fboB=null;
let bw=1, bh=1, iw=1, ih=1;

function destroyFBOs(){
  [sceneFBO,fboA,fboB].forEach(f=>f&&gl.deleteFramebuffer(f));
  [sceneTex,bloomA,bloomB].forEach(t=>t&&gl.deleteTexture(t));
  sceneTex=sceneFBO=bloomA=bloomB=fboA=fboB=null;
}

/* ---------------------------------------------------------------- state */

const QUAL = {
  low:    {scale:0.55, steps:220},
  medium: {scale:0.85, steps:400},
  high:   {scale:1.00, steps:600},
  ultra:  {scale:1.25, steps:900}
};
const coarse = matchMedia('(pointer:coarse)').matches;

const S = {
  exposure:1.0, discBright:1.0, bloom:0.45, speed:1.0, fov:50,
  quality: coarse ? 'medium' : 'high', auto:true,
  paused:false, autoScale:1.0
};
const cam = {az:0.0, el:0.30, dist:26.0};
const camHome = {az:0.0, el:0.30, dist:26.0};

/* optional deep-link overrides: ?quality=low&exposure=1.2&steps=300&scale=0.5 */
(function(){
  const q = new URLSearchParams(location.search);
  if(q.has('quality') && QUAL[q.get('quality')]) S.quality = q.get('quality');
  if(q.has('exposure')) S.exposure = parseFloat(q.get('exposure'))||S.exposure;
  if(q.has('steps')) S.stepsOverride = parseInt(q.get('steps'),10)||0;
  if(q.has('scale')) S.scaleOverride = parseFloat(q.get('scale'))||0;
  if(q.has('auto')) S.auto = q.get('auto')!=='0' && q.get('auto')!=='false';
})();

let simTime = 0, lastNow = performance.now(), fpsAvg = 60, uiTick = 0;

function applyQuality(){
  const q = QUAL[S.quality];
  S.steps = S.stepsOverride || q.steps;
  S.baseScale = S.scaleOverride || q.scale;
  resize(true);
}

function resize(force){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const cw = canvas.clientWidth || window.innerWidth;
  const ch = canvas.clientHeight || window.innerHeight;
  let scale = S.baseScale * (S.auto ? S.autoScale : 1.0);
  let w = Math.max(160, Math.round(cw*dpr*scale));
  let h = Math.max(90,  Math.round(ch*dpr*scale));
  const maxPix = 3.0e6;
  if(w*h > maxPix){ const k = Math.sqrt(maxPix/(w*h)); w = Math.round(w*k); h = Math.round(h*k); }
  if(!force && w===canvas.width && h===canvas.height) return;
  canvas.width = w; canvas.height = h;
  iw = w; ih = h;
  bw = Math.max(1, w>>2); bh = Math.max(1, h>>2);
  destroyFBOs();
  sceneTex = makeTex(iw,ih); sceneFBO = makeFBO(sceneTex);
  bloomA = makeTex(bw,bh); fboA = makeFBO(bloomA);
  bloomB = makeTex(bw,bh); fboB = makeFBO(bloomB);
}

window.addEventListener('resize', ()=>resize(false));

/* ---------------------------------------------------------------- camera input */

let dragging=false, lastX=0, lastY=0, pinch=0;
canvas.addEventListener('pointerdown', e=>{
  dragging=true; lastX=e.clientX; lastY=e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY;
  lastX=e.clientX; lastY=e.clientY;
  cam.az -= dx*0.005;
  cam.el = Math.max(-1.35, Math.min(1.35, cam.el + dy*0.005));
});
canvas.addEventListener('pointerup', ()=>{dragging=false;});
canvas.addEventListener('pointercancel', ()=>{dragging=false;});
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  cam.dist = Math.max(6.5, Math.min(55, cam.dist*Math.exp(e.deltaY*0.0011)));
},{passive:false});
canvas.addEventListener('touchstart', e=>{
  if(e.touches.length===2){
    pinch = Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
                       e.touches[0].clientY-e.touches[1].clientY);
  }
},{passive:true});
canvas.addEventListener('touchmove', e=>{
  if(e.touches.length===2 && pinch>0){
    const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
                         e.touches[0].clientY-e.touches[1].clientY);
    cam.dist = Math.max(6.5, Math.min(55, cam.dist*pinch/Math.max(d,1)));
    pinch = d;
  }
},{passive:true});

/* ---------------------------------------------------------------- UI */

function bindSlider(id, key, fmt){
  const el = document.getElementById(id), lab = document.getElementById(id+'V');
  const upd = ()=>{ S[key] = parseFloat(el.value); lab.textContent = fmt(S[key]); };
  el.addEventListener('input', upd); upd();
}
bindSlider('exposure','exposure', v=>v.toFixed(2));
bindSlider('discbright','discBright', v=>v.toFixed(2));
bindSlider('bloom','bloom', v=>v.toFixed(2));
bindSlider('speed','speed', v=>v.toFixed(2));
bindSlider('fov','fov', v=>v.toFixed(0)+'\u00B0');

const qSel = document.getElementById('quality');
qSel.value = S.quality;
qSel.addEventListener('change', ()=>{ S.quality = qSel.value; applyQuality(); });
const autoChk = document.getElementById('auto');
autoChk.checked = S.auto;
autoChk.addEventListener('change', e=>{ S.auto = e.target.checked; resize(false); });

const pauseBtn = document.getElementById('pause');
function setPause(p){
  S.paused = p;
  pauseBtn.textContent = p ? 'RESUME' : 'PAUSE';
}
pauseBtn.addEventListener('click', ()=>setPause(!S.paused));
document.getElementById('reset').addEventListener('click', ()=>{
  cam.az=camHome.az; cam.el=camHome.el; cam.dist=camHome.dist;
});
window.addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault(); setPause(!S.paused); }
  if(e.key==='r'||e.key==='R'){ cam.az=camHome.az; cam.el=camHome.el; cam.dist=camHome.dist; }
});

const statsEl = document.getElementById('stats');

/* ---------------------------------------------------------------- render */

function camBasis(){
  const ce=Math.cos(cam.el), se=Math.sin(cam.el);
  const ca=Math.cos(cam.az), sa=Math.sin(cam.az);
  const px=cam.dist*ce*sa, py=cam.dist*se, pz=cam.dist*ce*ca;
  const inv=1/Math.hypot(px,py,pz);
  const fx=-px*inv, fy=-py*inv, fz=-pz*inv;
  let rx=-fz, rz=fx;                             /* right = cross(fwd, up) */
  const rl=1/Math.hypot(rx,rz); rx*=rl; rz*=rl;
  const upx = -rz*fy;                            /* up = cross(right, fwd) */
  const upy =  rz*fx-rx*fz;
  const upz =  rx*fy;
  return {pos:[px,py,pz], fwd:[fx,fy,fz], right:[rx,0,rz], up:[upx,upy,upz]};
}

function drawQuad(){ gl.drawArrays(gl.TRIANGLE_STRIP,0,4); }

function render(now){
  const B = camBasis();
  const aspect = iw/ih;
  const tanF = Math.tan(S.fov*Math.PI/360);

  /* scene */
  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFBO);
  gl.viewport(0,0,iw,ih);
  gl.useProgram(progScene.p);
  gl.uniform2f(progScene.u.uRes, iw, ih);
  gl.uniform1f(progScene.u.uTime, simTime);
  gl.uniform3f(progScene.u.uCamPos, B.pos[0],B.pos[1],B.pos[2]);
  gl.uniform3f(progScene.u.uCamFwd, B.fwd[0],B.fwd[1],B.fwd[2]);
  gl.uniform3f(progScene.u.uCamRight, B.right[0],B.right[1],B.right[2]);
  gl.uniform3f(progScene.u.uCamUp, B.up[0],B.up[1],B.up[2]);
  gl.uniform1f(progScene.u.uTanFov, tanF);
  gl.uniform1i(progScene.u.uSteps, S.steps);
  gl.uniform1f(progScene.u.uExposure, S.exposure);
  gl.uniform1i(progScene.u.uHDR, HDR);
  gl.uniform1f(progScene.u.uDiscBright, S.discBright);
  gl.bindVertexArray(quad);
  drawQuad();

  /* bloom: bright pass -> blur H -> blur V (twice for a wide glow) */
  gl.useProgram(progPost.p);
  gl.bindVertexArray(quad);
  gl.uniform1i(progPost.u.uTex, 0);
  gl.uniform1f(progPost.u.uThreshold, 1.0);
  gl.activeTexture(gl.TEXTURE0);

  gl.bindFramebuffer(gl.FRAMEBUFFER, fboA); gl.viewport(0,0,bw,bh);
  gl.bindTexture(gl.TEXTURE_2D, sceneTex);
  gl.uniform2f(progPost.u.uTexel, 1/bw, 1/bh);
  gl.uniform1i(progPost.u.uMode, 0); drawQuad();

  for(let i=0;i<2;i++){
    gl.bindFramebuffer(gl.FRAMEBUFFER, fboB);
    gl.bindTexture(gl.TEXTURE_2D, bloomA);
    gl.uniform1i(progPost.u.uMode, 1); drawQuad();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fboA);
    gl.bindTexture(gl.TEXTURE_2D, bloomB);
    gl.uniform1i(progPost.u.uMode, 2); drawQuad();
  }

  /* composite */
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.useProgram(progComp.p);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, sceneTex);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, bloomA);
  gl.uniform1i(progComp.u.uScene, 0);
  gl.uniform1i(progComp.u.uBloom, 1);
  gl.uniform1f(progComp.u.uExposure, S.exposure);
  gl.uniform1f(progComp.u.uBloomAmt, S.bloom);
  gl.uniform1i(progComp.u.uHDR, HDR);
  gl.uniform1f(progComp.u.uTime, now*0.001);
  gl.bindVertexArray(quad);
  drawQuad();
}

/* ---------------------------------------------------------------- loop */

applyQuality();
/* sync UI with any overrides, then draw one frame immediately so the
   canvas is never blank (also makes headless screenshots reliable) */
(function(){
  const e=document.getElementById('exposure');
  e.value=S.exposure; e.dispatchEvent(new Event('input'));
})();
frame(performance.now());

function frame(now){
  const ms = now-lastNow; lastNow = now;
  const dt = Math.min(Math.max(ms,0.01),100)/1000;
  if(!S.paused) simTime += dt*S.speed;

  const fps = 1000/Math.max(ms,0.01);
  if(ms>=1) fpsAvg += (fps-fpsAvg)*0.06;

  if(S.auto){
    if(ms>36)      S.autoScale = Math.max(0.45, S.autoScale-0.015);
    else if(ms<17) S.autoScale = Math.min(1.0, S.autoScale+0.003);
    resize(false); /* no-op unless the target size actually changed */
  }

  render(now);

  if(now-uiTick > 250){
    uiTick = now;
    statsEl.textContent =
      fpsAvg.toFixed(0)+' FPS  ·  '+canvas.width+'×'+canvas.height+
      '  ·  '+S.steps+' STEPS'+(S.auto?'  ·  AUTO '+Math.round(S.autoScale*100)+'%':'')+
      (HDR?'':'  ·  LDR');
  }
  requestAnimationFrame(frame);
}

})();
</script>
</body>
</html>
