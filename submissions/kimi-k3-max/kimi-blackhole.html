<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gargantua — Interstellar Black Hole</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #000;
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #c {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; cursor: grab; touch-action: none;
  }
  #c.dragging { cursor: grabbing; }
  .hud {
    position: fixed; z-index: 5; pointer-events: none;
    color: rgba(235, 240, 255, .82);
    text-shadow: 0 0 14px rgba(120, 160, 255, .35);
  }
  #title { top: 34px; left: 42px; animation: fadein 2.4s ease .3s both; }
  #title .bar {
    width: 56px; height: 1px; margin-bottom: 14px;
    background: linear-gradient(90deg, rgba(190, 205, 255, .9), transparent);
  }
  #title h1 { font-size: 22px; font-weight: 300; letter-spacing: .55em; }
  #title p {
    margin-top: 9px; font-size: 10px; font-weight: 300;
    letter-spacing: .30em; color: rgba(200, 212, 255, .48);
  }
  #fps {
    top: 38px; right: 42px; font-size: 10px; letter-spacing: .25em;
    color: rgba(200, 212, 255, .38); text-align: right;
    animation: fadein 2.4s ease 1.4s both;
  }
  #hint {
    bottom: 26px; left: 50%; font-size: 10px; font-weight: 300;
    letter-spacing: .28em; color: rgba(210, 220, 245, .40); white-space: nowrap;
    animation: fadeinC 2.4s ease 1.1s both;
  }
  @keyframes fadein  { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeinC { from { opacity: 0; transform: translate(-50%, 6px); } to { opacity: 1; transform: translate(-50%, 0); } }
  #err {
    position: fixed; inset: 0; z-index: 50; display: none;
    align-items: center; justify-content: center; padding: 40px;
    background: rgba(0, 0, 0, .88); color: #ff8f8f;
    font: 13px/1.6 Consolas, monospace; text-align: center; white-space: pre-wrap;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="title" class="hud">
  <div class="bar"></div>
  <h1>GARGANTUA</h1>
  <p>REAL-TIME GRAVITATIONAL RAY-TRACING</p>
</div>
<div id="fps" class="hud"></div>
<div id="hint" class="hud">DRAG&nbsp;ORBIT&nbsp;&nbsp;&middot;&nbsp;&nbsp;SCROLL&nbsp;ZOOM&nbsp;&nbsp;&middot;&nbsp;&nbsp;DOUBLE-CLICK&nbsp;AUTO-ORBIT</div>
<div id="err"></div>

<script>
(function () {
"use strict";

var errBox = document.getElementById('err');
function showError(msg) {
  errBox.style.display = 'flex';
  errBox.textContent = String(msg);
}
window.addEventListener('error', function (e) {
  showError('Error: ' + (e.message || e.type));
});

var canvas = document.getElementById('c');
var fpsEl = document.getElementById('fps');

var gl = canvas.getContext('webgl2', {
  alpha: false, antialias: false, depth: false, stencil: false,
  powerPreference: 'high-performance', preserveDrawingBuffer: false
});
if (!gl) { showError('WebGL2 is not available in this browser.'); return; }

canvas.addEventListener('webglcontextlost', function (e) {
  e.preventDefault();
  showError('WebGL context lost. Please reload the page.');
});

// ------------------------------------------------------------------
// Float render-target support (HDR). Falls back to LDR byte targets.
// ------------------------------------------------------------------
function tryFloatTarget() {
  var ext = gl.getExtension('EXT_color_buffer_float') ||
            gl.getExtension('EXT_color_buffer_half_float');
  if (!ext) return false;
  var tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, 4, 4, 0, gl.RGBA, gl.HALF_FLOAT, null);
  var fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  var ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.deleteFramebuffer(fb);
  gl.deleteTexture(tex);
  return ok;
}
var LDR = !tryFloatTarget();

// URL params: ?q=0.5 (quality)  ?shot=3 (render N frames then freeze)
var params = new URLSearchParams(location.search);
var qParam = parseFloat(params.get('q'));
var shotFrames = parseInt(params.get('shot') || '0', 10) || 0;

// ------------------------------------------------------------------
// Shaders
// ------------------------------------------------------------------
var VER = '#version 300 es\n';
var PRE = LDR ? '#define LDR 1\n' : '';

var VS = VER + [
  'out vec2 vUv;',
  'void main(){',
  '  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));',
  '  vUv = p;',
  '  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);',
  '}'
].join('\n');

// ---------------- Scene: relativistic ray tracing -----------------
var FS_SCENE = VER + PRE + `
precision highp float;

uniform vec2  uRes;
uniform float uTime;
uniform vec3  uCamPos;
uniform vec3  uCamRight;
uniform vec3  uCamUp;
uniform vec3  uCamFwd;
uniform float uTanFov;
uniform float uAspect;

out vec4 frag;

const float RS       = 1.0;    // Schwarzschild radius
const float DISC_IN  = 2.7;    // accretion disc inner edge (in RS)
const float DISC_OUT = 6.4;    // accretion disc outer edge
const int   STEPS    = 320;

vec3 aces(vec3 x){
  return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0);
}

float hash13(vec3 p){
  p = fract(p * 0.1031);
  p += dot(p, p.zyx + 31.32);
  return fract((p.x + p.y) * p.z);
}
vec3 hash33(vec3 p){
  p = fract(p * vec3(0.1031, 0.1030, 0.0973));
  p += dot(p, p.yxz + 33.33);
  return fract((p.xxy + p.yxx) * p.zyx);
}
float noise3(vec3 p){
  vec3 i = floor(p);
  vec3 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float n000 = hash13(i);
  float n100 = hash13(i + vec3(1.0,0.0,0.0));
  float n010 = hash13(i + vec3(0.0,1.0,0.0));
  float n110 = hash13(i + vec3(1.0,1.0,0.0));
  float n001 = hash13(i + vec3(0.0,0.0,1.0));
  float n101 = hash13(i + vec3(1.0,0.0,1.0));
  float n011 = hash13(i + vec3(0.0,1.0,1.0));
  float n111 = hash13(i + vec3(1.0,1.0,1.0));
  return mix(
    mix(mix(n000, n100, f.x), mix(n010, n110, f.x), f.y),
    mix(mix(n001, n101, f.x), mix(n011, n111, f.x), f.y),
    f.z);
}
float fbm3(vec3 p){
  float s = 0.0;
  float a = 0.5;
  for (int i = 0; i < 4; i++){
    s += a * noise3(p);
    p = p * 2.13 + vec3(17.7, 9.2, 5.1);
    a *= 0.5;
  }
  return s;
}

// Planckian locus approximation (Tanner Helland), T in Kelvin
vec3 blackbody(float tt){
  float t = clamp(tt, 800.0, 15000.0) / 100.0;
  float r, g, b;
  if (t <= 66.0){
    r = 1.0;
    g = clamp((99.4708025861 * log(t) - 161.1195681661) / 255.0, 0.0, 1.0);
  } else {
    r = clamp(1.29293618 * pow(t - 60.0, -0.1332047592), 0.0, 1.0);
    g = clamp(1.12989086 * pow(t - 60.0, -0.0755148492), 0.0, 1.0);
  }
  if (t >= 66.0)      b = 1.0;
  else if (t <= 19.0) b = 0.0;
  else                b = clamp((138.5177312231 * log(t - 10.0) - 305.0447927307) / 255.0, 0.0, 1.0);
  return vec3(r, g, b);
}

vec3 starLayer(vec3 d, float n, float density, float size){
  vec3 p = d * n;
  vec3 cell = floor(p);
  vec3 rnd = hash33(cell);
  if (rnd.x > density) return vec3(0.0);
  vec3 sp = 0.15 + 0.7 * hash33(cell + 7.7);
  float dist = length(fract(p) - sp);
  float star = exp(-dist * dist / (size * size));
  float mag = pow(rnd.y, 6.0) * 2.4 + 0.12;
  vec3 tint = mix(vec3(0.62, 0.74, 1.0), vec3(1.0, 0.78, 0.58), rnd.z);
  tint = mix(tint, vec3(1.0), 0.35);
  return star * mag * tint;
}

vec3 background(vec3 d){
  vec3 col = vec3(0.004, 0.005, 0.009);
  // galactic band with dust lanes
  vec3 bandN = normalize(vec3(0.35, 1.0, 0.22));
  float band = exp(-pow(abs(dot(d, bandN)), 1.5) * 6.0);
  float neb  = fbm3(d * 2.6 + vec3(4.2, 1.3, 8.8));
  float dust = fbm3(d * 6.1 + vec3(9.4, 3.1, 2.7));
  vec3 nebCol = mix(vec3(0.015, 0.025, 0.060), vec3(0.090, 0.060, 0.045), neb);
  nebCol += vec3(0.05, 0.035, 0.08) * neb * neb;
  col += band * nebCol * (0.5 + 0.9 * neb) * (0.35 + 0.75 * dust);
  // star fields
  col += starLayer(d,  40.0, 0.10, 0.045) * 1.6;
  col += starLayer(d,  90.0, 0.14, 0.050);
  col += starLayer(d, 180.0, 0.16, 0.055) * 0.7;
  return col;
}

// Accretion disc emission at plane-crossing point p, photon dir v
vec4 discColor(vec3 p, vec3 v){
  float r = length(p.xz);
  if (r < DISC_IN || r > DISC_OUT) return vec4(0.0);
  float rn = (r - DISC_IN) / (DISC_OUT - DISC_IN);

  // Keplerian angular velocity: pattern shears differentially over time
  float omega = 3.2 * pow(r, -1.5);
  float ang = atan(p.z, p.x) - uTime * omega;
  float ca = cos(ang), sa = sin(ang);

  // tangentially-streaked turbulence (seam-free via cos/sin embedding)
  float n1 = fbm3(vec3(ca * 1.9, sa * 1.9, r * 5.5));
  float n2 = fbm3(vec3(ca * 4.7, sa * 4.7, r * 11.0 + 3.7));
  float tex = clamp(0.22 + 1.30 * (n1 * 0.70 + n2 * 0.58), 0.0, 1.8);

  // thin-disc emissivity profile, peaks just outside the inner edge
  float invR  = DISC_IN / r;
  float emiss = invR * invR * invR * (1.0 - sqrt(invR));
  emiss *= 0.35 + 0.65 * pow(invR, 1.2);   // steeper radial falloff
  emiss += 0.045 * exp(-pow((r - DISC_IN - 0.15) / 0.30, 2.0)); // hot inner rim

  // orbital velocity (geometric units, c = 1), clockwise from +Y
  float beta = min(0.75 / sqrt(max(r - 1.0, 0.30)), 0.82);
  vec3 tang  = normalize(vec3(p.z, 0.0, -p.x));
  vec3 bvec  = tang * beta;
  float gam  = inversesqrt(max(1.0 - beta * beta, 0.05));
  float dopp = 1.0 / (gam * (1.0 - dot(bvec, -v)));        // relativistic Doppler
  float grav = sqrt(max(1.0 - RS / r, 0.02));              // gravitational redshift
  float gtot = clamp(dopp * grav, 0.05, 4.0);

  float temp = 7200.0 * pow(invR, 0.9) * gtot;
  vec3  bb   = blackbody(temp);

  float bright = emiss * 30.0 * tex * pow(gtot, 3.0);
  vec3 col = bb * bright;

  float alpha = clamp(emiss * 20.0 * (0.45 + 0.55 * tex), 0.0, 1.0);
  alpha *= smoothstep(0.0, 0.05, rn) * (1.0 - smoothstep(0.82, 1.0, rn));
  return vec4(col, alpha);
}

void main(){
  vec2 uv = (gl_FragCoord.xy / uRes) * 2.0 - 1.0;
  vec3 v = normalize(uCamFwd + uTanFov * (uv.x * uAspect * uCamRight + uv.y * uCamUp));

  vec3 p = uCamPos;
  vec3 h3v = cross(p, v);
  float h2 = dot(h3v, h3v);           // conserved specific angular momentum

  vec3 col = vec3(0.0);
  float trans = 1.0;
  bool addBg = true;

  // Fast path: rays that stay far from the hole and never reach the disc
  float b = length(h3v);
  float tPlane = (abs(v.y) > 1e-4) ? (-p.y / v.y) : -1.0;
  bool planeNear = tPlane > 0.0 && length((p + v * tPlane).xz) < DISC_OUT + 3.0;

  if (b > 15.0 && !planeNear){
    col = background(v);
  } else {
    vec3 prev = p;
    for (int i = 0; i < STEPS; i++){
      float r2 = dot(p, p);
      float r  = sqrt(r2);
      if (r < RS){ addBg = false; break; }                    // captured by horizon
      if (r > 40.0 && dot(p, v) > 0.0) break;                 // escaped
      prev = p;
      float dt = clamp(0.06 * r, 0.012, 0.5);
      // null geodesic: d2x/dl2 = -(3/2) h^2 x / r^5
      float r5 = r2 * r2 * r;
      vec3 acc = (-1.5 * h2 / r5) * p;
      v += acc * dt;
      p += v * dt;
      // disc plane crossing
      if (prev.y * p.y < 0.0){
        float t = prev.y / (prev.y - p.y);
        vec3 hp = prev + (p - prev) * t;
        vec4 dc = discColor(hp, normalize(v));
        col += trans * dc.rgb * dc.a;
        trans *= 1.0 - dc.a;
        if (trans < 0.02){ addBg = false; break; }
      }
    }
    if (addBg && trans > 0.001) col += trans * background(normalize(v));
  }

#ifdef LDR
  col = aces(col * 1.18);
  col = pow(col, vec3(1.0 / 2.2));
#endif
  frag = vec4(col, 1.0);
}
`;

// ------------------------- Bright pass ----------------------------
var FS_BRIGHT = VER + PRE + `
precision highp float;
uniform sampler2D uTex;
in vec2 vUv;
out vec4 o;
void main(){
  vec3 c = texture(uTex, vUv).rgb;
  float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
#ifdef LDR
  float w = smoothstep(0.70, 0.98, l);
#else
  float w = smoothstep(1.0, 4.0, l);
#endif
  o = vec4(c * w, 1.0);
}
`;

// ------------------------- Gaussian blur --------------------------
var FS_BLUR = VER + `
precision highp float;
uniform sampler2D uTex;
uniform vec2 uDir;
in vec2 vUv;
out vec4 o;
void main(){
  const float w[5] = float[5](0.2270270270, 0.1945945946, 0.1216216216, 0.0540540541, 0.0162162162);
  vec3 c = texture(uTex, vUv).rgb * w[0];
  for (int i = 1; i < 5; i++){
    vec2 off = uDir * float(i);
    c += texture(uTex, vUv + off).rgb * w[i];
    c += texture(uTex, vUv - off).rgb * w[i];
  }
  o = vec4(c, 1.0);
}
`;

// ------------------------- Composite ------------------------------
var FS_COMP = VER + PRE + `
precision highp float;
uniform sampler2D uScene;
uniform sampler2D uBloom;
uniform float uTime;
in vec2 vUv;
out vec4 o;
vec3 aces(vec3 x){
  return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0);
}
float hash12(vec2 p){
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
void main(){
  vec2 off = (vUv - 0.5) * 0.0028;          // subtle chromatic aberration
  vec3 col;
  col.r = texture(uScene, vUv + off).r;
  col.g = texture(uScene, vUv).g;
  col.b = texture(uScene, vUv - off).b;
  vec3 bloom = texture(uBloom, vUv).rgb;
#ifdef LDR
  col += bloom * 0.8;
#else
  col += bloom * 0.8;
  col = aces(col * 1.0);
  col = pow(col, vec3(1.0 / 2.2));
#endif
  float vig = 1.0 - 0.30 * pow(length(vUv - 0.5) * 1.32, 2.3);
  col *= vig;
  float g = hash12(gl_FragCoord.xy + fract(uTime * 0.7) * 371.0);
  col += (g - 0.5) * 0.022;                 // film grain
  o = vec4(clamp(col, 0.0, 1.0), 1.0);
}
`;

// ------------------------------------------------------------------
// GL plumbing
// ------------------------------------------------------------------
function compile(type, src) {
  var s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    var log = gl.getShaderInfoLog(s);
    showError('Shader compile error:\n' + log);
    throw new Error(log);
  }
  return s;
}
function makeProgram(fsSrc) {
  var p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    var log = gl.getProgramInfoLog(p);
    showError('Program link error:\n' + log);
    throw new Error(log);
  }
  return p;
}
function U(p, n) { return gl.getUniformLocation(p, n); }

var progScene, progBright, progBlur, progComp;
try {
  progScene  = makeProgram(FS_SCENE);
  progBright = makeProgram(FS_BRIGHT);
  progBlur   = makeProgram(FS_BLUR);
  progComp   = makeProgram(FS_COMP);
} catch (e) { return; }

var uS = {
  res: U(progScene, 'uRes'),   time: U(progScene, 'uTime'),
  pos: U(progScene, 'uCamPos'),
  right: U(progScene, 'uCamRight'), up: U(progScene, 'uCamUp'),
  fwd: U(progScene, 'uCamFwd'),
  tan: U(progScene, 'uTanFov'), asp: U(progScene, 'uAspect')
};
var uB = { tex: U(progBright, 'uTex') };
var uBl = { tex: U(progBlur, 'uTex'), dir: U(progBlur, 'uDir') };
var uC = { scene: U(progComp, 'uScene'), bloom: U(progComp, 'uBloom'), time: U(progComp, 'uTime') };

gl.disable(gl.DEPTH_TEST);
gl.disable(gl.BLEND);

function createTarget(w, h) {
  var tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  if (LDR) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  else     gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  var fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { fb: fb, tex: tex, w: w, h: h };
}
function deleteTarget(t) {
  if (!t) return;
  gl.deleteFramebuffer(t.fb);
  gl.deleteTexture(t.tex);
}

var sceneRT = null, bloomA = null, bloomB = null;
function rebuildTargets(w, h) {
  deleteTarget(sceneRT); deleteTarget(bloomA); deleteTarget(bloomB);
  var bw = Math.max(1, w >> 2), bh = Math.max(1, h >> 2);
  sceneRT = createTarget(w, h);
  bloomA  = createTarget(bw, bh);
  bloomB  = createTarget(bw, bh);
}

// ------------------------------------------------------------------
// Camera, input, quality scaling
// ------------------------------------------------------------------
var theta = 0.0, phi = 1.42, dist = 8.0;
var thP = parseFloat(params.get('th')); if (isFinite(thP)) theta = thP;
var phP = parseFloat(params.get('ph')); if (isFinite(phP)) phi = Math.max(0.05, Math.min(Math.PI - 0.05, phP));
var dP  = parseFloat(params.get('d'));  if (isFinite(dP))  dist = Math.max(4.5, Math.min(16.0, dP));
var autoOrbit = true;
var lastInteract = -1e9;

var baseScale = Math.min(window.devicePixelRatio || 1, 1.5);
var quality = (isFinite(qParam) && qParam > 0.05 && qParam <= 1) ? qParam : 1.0;
var fixedQuality = isFinite(qParam) && qParam > 0.05;

var pointers = new Map();
var pinchDist = 0;

canvas.addEventListener('pointerdown', function (e) {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    var pts = Array.from(pointers.values());
    pinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
  }
  lastInteract = performance.now();
  canvas.classList.add('dragging');
});
canvas.addEventListener('pointermove', function (e) {
  if (!pointers.has(e.pointerId)) return;
  var prev = pointers.get(e.pointerId);
  var dx = e.clientX - prev.x, dy = e.clientY - prev.y;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  lastInteract = performance.now();
  if (pointers.size === 1) {
    theta -= dx * 0.0045;
    phi   -= dy * 0.0045;
    phi = Math.max(0.05, Math.min(Math.PI - 0.05, phi));
  } else if (pointers.size === 2) {
    var pts = Array.from(pointers.values());
    var nd = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    if (pinchDist > 0 && nd > 0) {
      dist *= pinchDist / nd;
      dist = Math.max(4.5, Math.min(16.0, dist));
    }
    pinchDist = nd;
  }
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size === 0) canvas.classList.remove('dragging');
  lastInteract = performance.now();
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', function (e) {
  e.preventDefault();
  dist *= Math.exp(e.deltaY * 0.001);
  dist = Math.max(4.5, Math.min(16.0, dist));
  lastInteract = performance.now();
}, { passive: false });
canvas.addEventListener('dblclick', function () {
  autoOrbit = !autoOrbit;
  lastInteract = performance.now();
});

function norm3(v) {
  var l = Math.hypot(v[0], v[1], v[2]) || 1;
  return [v[0] / l, v[1] / l, v[2] / l];
}
function cross3(a, b) {
  return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
}

function resizeIfNeeded() {
  var scale = baseScale * quality;
  var w = Math.max(2, Math.floor(canvas.clientWidth * scale));
  var h = Math.max(2, Math.floor(canvas.clientHeight * scale));
  if (w === canvas.width && h === canvas.height && sceneRT) return;
  canvas.width = w;
  canvas.height = h;
  rebuildTargets(w, h);
}
window.addEventListener('resize', resizeIfNeeded);

// ------------------------------------------------------------------
// Render passes
// ------------------------------------------------------------------
function drawTri() { gl.drawArrays(gl.TRIANGLES, 0, 3); }

function render(timeS) {
  resizeIfNeeded();

  // camera basis
  var sp = Math.sin(phi), cp = Math.cos(phi);
  var pos = [dist * sp * Math.cos(theta), dist * cp, dist * sp * Math.sin(theta)];
  var fwd = norm3([-pos[0], -pos[1], -pos[2]]);
  var right = norm3(cross3(fwd, [0, 1, 0]));
  var up = cross3(right, fwd);

  // 1. scene
  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneRT.fb);
  gl.viewport(0, 0, sceneRT.w, sceneRT.h);
  gl.useProgram(progScene);
  gl.uniform2f(uS.res, sceneRT.w, sceneRT.h);
  gl.uniform1f(uS.time, timeS);
  gl.uniform3f(uS.pos, pos[0], pos[1], pos[2]);
  gl.uniform3f(uS.right, right[0], right[1], right[2]);
  gl.uniform3f(uS.up, up[0], up[1], up[2]);
  gl.uniform3f(uS.fwd, fwd[0], fwd[1], fwd[2]);
  gl.uniform1f(uS.tan, Math.tan(0.95 / 2));
  gl.uniform1f(uS.asp, sceneRT.w / sceneRT.h);
  drawTri();

  // 2. bright pass into bloomA
  gl.bindFramebuffer(gl.FRAMEBUFFER, bloomA.fb);
  gl.viewport(0, 0, bloomA.w, bloomA.h);
  gl.useProgram(progBright);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, sceneRT.tex);
  gl.uniform1i(uB.tex, 0);
  drawTri();

  // 3. two separable blur iterations (A <-> B)
  gl.useProgram(progBlur);
  gl.uniform1i(uBl.tex, 0);
  var dx = 1 / bloomA.w, dy = 1 / bloomA.h;
  var i, src, dstt, dir;
  for (i = 0; i < 4; i++) {
    src = (i % 2 === 0) ? bloomA : bloomB;
    dstt = (i % 2 === 0) ? bloomB : bloomA;
    dir = (i < 2) ? [dx, 0] : [0, dy];
    gl.bindFramebuffer(gl.FRAMEBUFFER, dstt.fb);
    gl.viewport(0, 0, dstt.w, dstt.h);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, src.tex);
    gl.uniform2f(uBl.dir, dir[0], dir[1]);
    drawTri();
  }
  // bloom result now in bloomA

  // 4. composite to screen
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(progComp);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, sceneRT.tex);
  gl.uniform1i(uC.scene, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, bloomA.tex);
  gl.uniform1i(uC.bloom, 1);
  gl.uniform1f(uC.time, timeS);
  drawTri();
}

// ------------------------------------------------------------------
// Main loop
// ------------------------------------------------------------------
var t0 = performance.now();
var lastT = t0;
var frameMs = 16.7;
var frameCount = 0;
var fpsAccum = 0, fpsFrames = 0;
var adjustCooldown = 60;

function loop(now) {
  var dtMs = now - lastT;
  lastT = now;
  frameMs = frameMs * 0.92 + Math.min(dtMs, 100) * 0.08;

  var dt = Math.min(dtMs / 1000, 0.1);
  if (autoOrbit && now - lastInteract > 2500) theta += dt * 0.045;

  render((now - t0) / 1000);
  frameCount++;

  // fps meter
  fpsAccum += dtMs; fpsFrames++;
  if (fpsAccum > 500) {
    var fps = Math.round(1000 * fpsFrames / fpsAccum);
    fpsEl.textContent = fps + ' FPS · ' + Math.round(quality * 100) + '%' + (LDR ? ' · LDR' : '');
    fpsAccum = 0; fpsFrames = 0;
  }

  // adaptive resolution (disabled when ?q= or ?shot= is used)
  if (!fixedQuality && !shotFrames && frameCount > 60) {
    if (adjustCooldown > 0) { adjustCooldown--; }
    else if (frameMs > 30 && quality > 0.45) {
      quality = Math.max(0.45, quality * 0.85);
      adjustCooldown = 90;
    } else if (frameMs < 14 && quality < 1) {
      quality = Math.min(1, quality * 1.12);
      adjustCooldown = 90;
    }
  }

  if (shotFrames && frameCount >= shotFrames) {
    document.title = 'SHOT_READY';
    return; // freeze for headless screenshot
  }
  requestAnimationFrame(loop);
}

resizeIfNeeded();
requestAnimationFrame(loop);

})();
</script>
